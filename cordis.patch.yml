# dsh-dual-bridge bundle patch
# 只挂载自身。不要把 dsh-better-sidebar 的 insert 行塞进来：
# 实测（0.13.0）这样做在已有 sidebar 的 profile 里会重复注册 /sidebar/api，
# 在没有 sidebar 的 profile 里又拿不到它提供的 betterSidebar 服务——
# DSH 的 bundle 层不支持“包内再挂一个 bundle”，所以 sidebar 必须作为
# profile 的直接依赖、由安装命令一起登记。
- insert:
    - id: dual-bridge
      name: 'dsh-dual-bridge'
